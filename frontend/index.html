<!doctype html>
<html lang="it" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GameDeals Italia</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap"
    />
    <!-- Apply saved theme BEFORE React loads to prevent flash -->
    <script>
      try {
        const s = JSON.parse(localStorage.getItem('jickjacks_settings') || '{}');
        document.documentElement.className = s.theme === 'light' ? 'light' : 'dark';
      } catch(e) {
        document.documentElement.className = 'dark';
      }
    </script>
  </head>
  <body class="bg-bg-primary text-text-primary">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
